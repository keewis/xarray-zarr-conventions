[workspace]
channels = ["conda-forge"]
name = "xarray-zarr-conventions"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

[workspace.exclude-newer]
cutoff = "7d"
[workspace.exclude-newer.exemptions]
certifi = "*"

[package]
name = "xarray-zarr-conventions"
version = "9999.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[package.run-dependencies]
xarray = ">=2026.09.0"

[package.run-constraints]
xproj = ">=0.2.1"
rasterix = ">=0.2.2"
xdggs = ">=0.7.0"

[tasks]

[dependencies]
xarray-zarr-conventions = { path = "." }
xarray = { path = "../xarray" }

[feature.optional-dependencies.dependencies]
xproj = "*"
rasterix = "*"
xdggs = "*"

[feature.dev.dependencies]
ipython = "*"
black = ">=26.10.1"

[feature.dev.target.unix.dependencies]
pdbpp = ">=0.12.1"

[feature.lints.dependencies]
prek = "*"

[feature.py313.dependencies]
python = "3.13.*"

# [feature.py314.dependencies]
# python = "3.14.*"

# [feature.py315.dependencies]
# python = "3.15.*"

[environments]
# ci-py312 = { features = ["py312", "optional-dependencies"] }
# ci-py314 = { features = ["py314", "optional-dependencies"] }
# ci-py315 = { features = ["py315", "optional-dependencies"] }
default = { features = [
  "dev",
  "py313",
  "optional-dependencies",
] }
lints = { features = ["lints"], no-default-feature = true }
